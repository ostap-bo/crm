<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Особистий Workspace — CRM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F4EF3'/%3E%3Cpath d='M16 6l2.6 7.4L26 16l-7.4 2.6L16 26l-2.6-7.4L6 16l7.4-2.6z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#2F4EF3;
    --accent-dark:#0124A4;
    --accent-light:#E8ECFE;
    --accent-contrast:#ffffff;
    --accent-grad:linear-gradient(135deg, #2F4EF3 0%, #0124A4 100%);
    --radius:16px;
    --radius-sm:10px;
    --ws-personal:#eab308;
    --ws-kofax:#2563eb;
    --pr-critical:#E5484D;
    --pr-high:#F5A524;
    --pr-medium:#14B8A6;
    --pr-low:#6B7080;
  }
  html[data-theme="light"]{
    --bg:#F5F6FB;
    --surface:#ffffff;
    --surface-2:#F3F4FA;
    --surface-3:#E9ECF6;
    --text:#14161F;
    --text-dim:#6B7186;
    --border:#E8EAF3;
    --border-strong:#D5D9E8;
    --shadow:0 1px 2px rgba(16,24,64,.04), 0 6px 20px rgba(16,24,64,.05);
    --overlay:rgba(10,11,20,.45);
  }
  html[data-theme="dark"]{
    --bg:#0A0B12;
    --surface:#14151F;
    --surface-2:#1B1D2A;
    --surface-3:#21243A;
    --text:#F2F3F8;
    --text-dim:#9195A8;
    --border:#272A3A;
    --border-strong:#33374A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --overlay:rgba(0,0,0,.6);
    --accent:#5B78FF;
    --accent-dark:#1C2FC2;
    --accent-grad:linear-gradient(135deg, #5B78FF 0%, #1C2FC2 100%);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  button, .chip, .btn, .icon-btn, .nav-item, .custom-select-btn, .custom-select-opt,
  .list-row, .month-cell, .week-cell, .col-task-row, .col-proj-row, .cal-head .modes button,
  .status-pill, .tag, .dropdown button, .inbox-menu button, .notif-row, .ws-legend-row{
    user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;
  }
  body{
    margin:0;
    font-family:'Manrope','-apple-system',BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{height:100vh;width:100vw;display:flex;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);}
  ::-webkit-scrollbar-track{background:transparent;}
  a{color:inherit;}
  svg{display:block;}

  /* ---------- LOGIN ---------- */
  .login-screen{
    height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 20% 20%, var(--accent-light), var(--bg) 55%);
  }
  html[data-theme="dark"] .login-screen{
    background:radial-gradient(circle at 20% 20%, #17301f, var(--bg) 55%);
  }
  .login-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:48px 44px;width:380px;box-shadow:var(--shadow);text-align:center;
  }
  .login-logo{
    width:56px;height:56px;background:var(--accent-grad);border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#fff;
  }
  .login-card h1{font-size:20px;margin:0 0 6px;}
  .login-card p{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
  .google-btn{
    width:100%;padding:12px 16px;border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);
    background:var(--surface-2);color:var(--text);font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s;
  }
  .google-btn:hover{border-color:var(--accent);background:var(--accent-light);}
  .google-btn:disabled{opacity:.6;cursor:default;}
  .login-foot{margin-top:18px;font-size:12px;color:var(--text-dim);}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:244px;flex:none;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 12px 16px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;}
  .brand-mark{width:34px;height:34px;background:var(--accent-grad);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .brand-name{font-weight:800;font-size:17px;line-height:1.1;letter-spacing:-.01em;}
  .brand-sub{font-size:11px;color:var(--text-dim);font-weight:500;}
  .nav-label{font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;padding:0 12px 8px;opacity:.9;}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
    border:none;background:transparent;color:#4B5168;font-size:14px;font-weight:600;text-align:left;width:100%;
    transition:.12s;text-decoration:none;cursor:pointer;box-sizing:border-box;
  }
  .nav-item svg{flex:none;opacity:.9;}
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--accent-grad);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(47,78,243,.28);}
  .nav-sep{height:1px;background:var(--border);margin:12px 8px;}
  .ws-legend{padding:2px 0 10px;font-size:12px;color:var(--text-dim);}
  .ws-legend-head{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;}
  .ws-legend-add{width:22px;height:22px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;padding:0;transition:.12s;}
  .ws-legend-add svg{width:12px;height:12px;}
  .ws-legend-add:hover{background:var(--accent-light);color:var(--accent);}
  .ws-legend-row{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;border-radius:10px;font-size:13px;font-weight:600;color:#4B5168;}
  .ws-legend-row:hover{background:var(--surface-2);}
  .ws-legend-row.active{background:var(--surface-2);font-weight:700;color:var(--text);}
  .ws-legend-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ws-legend-row .count{margin-left:auto;font-size:10.5px;background:var(--surface-3);border-radius:999px;padding:1px 8px;color:var(--text-dim);font-weight:700;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .sidebar-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:6px;}
  .profile-row{display:flex;align-items:center;gap:10px;padding:6px 8px;position:relative;border-radius:12px;}
  .profile-row:hover{background:var(--surface-2);}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;overflow:hidden;}
  .profile-name{font-size:13px;font-weight:600;}
  .profile-email{font-size:11px;color:var(--text-dim);}
  .profile-menu-btn{margin-left:auto;background:none;border:none;color:var(--text-dim);padding:4px;}
  .profile-menu-btn:hover{background:var(--surface-2);}
  .dropdown{
    border-radius:var(--radius-sm);overflow:hidden;
    position:absolute;bottom:46px;left:6px;right:6px;background:var(--surface);border:1.5px solid var(--border-strong);
    box-shadow:var(--shadow);z-index:40;
  }
  .dropdown button{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:none;font-size:13px;color:var(--text);}
  .dropdown button:hover{background:var(--surface-2);}

  /* ---------- MAIN ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
  .topbar{
    display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--border);flex:none;background:var(--surface);
  }
  .topbar h2{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .topbar .spacer{flex:1;}
  .search-pill{
    display:flex;align-items:center;gap:9px;width:250px;height:40px;padding:0 16px;border-radius:999px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:13px;font-weight:500;text-align:left;transition:.15s;
  }
  .search-pill:hover{border-color:var(--border-strong);background:var(--surface-3);}
  .search-pill svg{flex:none;width:16px;height:16px;}
  .user-chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 5px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;flex:none;transition:.15s;}
  .user-chip:hover{background:var(--surface-3);}
  .user-chip-role{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-light);border-radius:999px;padding:5px 11px;}
  .icon-btn{
    border-radius:50%;
    width:40px;height:40px;border:1px solid var(--border);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);position:relative;transition:.15s;flex:none;
  }
  .icon-btn:hover{background:var(--surface-3);color:var(--text);}
  .notif-dot{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--pr-critical);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);}
  .btn{
    border-radius:var(--radius-sm);
    padding:10px 16px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:.15s;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .btn:hover{background:var(--surface-3);}
  .btn-primary{background:var(--accent-grad);border-color:transparent;color:#fff;filter:none;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:active{transform:scale(.98);}
  .btn-sm{padding:7px 12px;font-size:12px;}
  .btn-ghost{border-color:transparent;background:transparent;box-shadow:none;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger-text{color:var(--pr-critical);}
  .btn-lg{padding:13px 24px;font-size:14.5px;border-radius:var(--radius);}

  /* upwork */
  .upwork-timer-card{text-align:center;padding:30px 18px 26px;}
  .upwork-timer-display{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .upwork-timer-actions{display:flex;gap:10px;justify-content:center;}
  .upwork-stats-row{display:flex;gap:16px;margin:16px 0;}
  .upwork-stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);}
  .upwork-stat-val{font-size:22px;font-weight:800;}
  .upwork-stat-lbl{font-size:11.5px;color:var(--text-dim);font-weight:700;margin-top:3px;}
  .upwork-date-group:not(:first-child){margin-top:8px;}
  .upwork-date-head{font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;padding:10px 6px 4px;border-top:1px solid var(--border);}
  .upwork-date-group:first-child .upwork-date-head{border-top:none;padding-top:0;}
  @media (max-width:700px){.upwork-stats-row{flex-direction:column;} .upwork-timer-display{font-size:42px;}}

  /* budget module */
  .bgt-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 8px 6px 6px;margin-bottom:18px;box-shadow:var(--shadow);flex-wrap:wrap;}
  .bgt-tabs{display:flex;gap:2px;flex-wrap:wrap;}
  .bgt-tab{padding:9px 14px;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s;}
  .bgt-tab:hover{background:var(--surface-2);color:var(--text);}
  .bgt-tab.active{background:var(--accent-grad);color:#fff;}
  .bgt-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media (max-width:1000px){.bgt-stat-row{grid-template-columns:1fr 1fr;}}
  @media (max-width:600px){.bgt-stat-row{grid-template-columns:1fr;}}
  .bgt-stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;}
  .bgt-stat-card:hover{border-color:var(--border-strong);}
  .bgt-stat-lbl{font-size:11.5px;color:var(--text-dim);font-weight:700;margin-bottom:6px;}
  .bgt-stat-val{font-size:22px;font-weight:800;}
  .bgt-pos{color:var(--pr-medium);}
  .bgt-neg{color:var(--pr-critical);}
  .bgt-stat-delta{font-size:11px;color:var(--text-dim);margin-top:4px;font-weight:700;}
  .bgt-stat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .bgt-ccy-switch{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px;border:1px solid var(--border);}
  .bgt-ccy-btn{padding:6px 13px;border:none;background:transparent;border-radius:5px;font-size:12px;font-weight:800;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;}
  .bgt-ccy-btn:hover{background:var(--surface-3);color:var(--text);}
  .bgt-ccy-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .bgt-period-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .bgt-period-tab{padding:7px 14px;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
  .bgt-period-tab:hover{background:var(--surface-3);border-color:var(--border-strong);color:var(--text);}
  .bgt-period-tab.active{background:var(--accent-grad);border-color:transparent;color:#fff;}
  .bgt-filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .bgt-filter-row > div{flex:1;min-width:130px;}
  .bgt-filter-row .bgt-search{flex:1.6;min-width:180px;}
  .bgt-input-plain::-webkit-outer-spin-button,.bgt-input-plain::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .bgt-input-plain{-moz-appearance:textfield;}
  .bgt-tx-compact{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
  .bgt-tx-compact:last-child{border-bottom:none;}
  .bgt-tx-compact:hover{background:var(--surface-2);}
  .bgt-tx-compact .bgt-tx-label{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bgt-tx-compact .bgt-tx-cat{font-size:11.5px;color:var(--text-dim);flex:none;}
  .bgt-tx-compact .bgt-tx-amt{font-size:14px;font-weight:800;flex:none;}
  .bgt-upcoming-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .bgt-upcoming-row:last-child{border-bottom:none;}
  .bgt-upcoming-row .title{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bgt-cat-row{padding:6px 0;border-bottom:1px solid var(--border);}
  .bgt-cat-row:last-child{border-bottom:none;}
  .bgt-color-picker{display:flex;flex-wrap:wrap;gap:8px;}
  .bgt-color-swatch{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:transform .12s;}
  .bgt-color-swatch:hover{transform:scale(1.12);}
  .bgt-color-swatch.active{border-color:var(--text);}
  .bgt-type-switch{display:flex;gap:4px;margin-bottom:14px;background:var(--surface-2);border-radius:7px;padding:4px;}
  .bgt-type-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:5px;font-size:12.5px;font-weight:700;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;}
  .bgt-type-btn:hover{background:var(--surface-3);}
  .bgt-type-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .bgt-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .bgt-table th{text-align:left;font-size:11px;color:var(--text-dim);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--border-strong);}
  .bgt-table td{padding:8px;border-bottom:1px solid var(--border);}
  .bgt-table tr:last-child td{border-bottom:none;}
  .bgt-insights{margin:0;padding-left:18px;font-size:13px;line-height:1.9;}
  .bgt-insights li{margin-bottom:2px;}
  .bgt-health-row{display:flex;gap:14px;flex-wrap:wrap;}
  .bgt-health-item{flex:1;min-width:110px;text-align:center;}
  .bgt-health-val{font-size:17px;font-weight:800;}
  .bgt-health-lbl{font-size:10.5px;color:var(--text-dim);font-weight:700;margin-top:3px;}
  .bgt-recur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .bgt-recur-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .bgt-recur-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow);}
  .bgt-recur-inactive{opacity:.5;}
  .bgt-recur-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;}
  .bgt-recur-name{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bgt-recur-amount{font-size:13.5px;font-weight:800;color:var(--text-dim);flex:none;}
  .bgt-recur-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .bgt-badge{display:inline-block;padding:4px 9px;border-radius:5px;background:var(--surface-2);color:var(--text-dim);font-size:10.5px;font-weight:700;}
  .bgt-badge-due{background:var(--pr-high);color:#fff;}
  .bgt-recur-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .bgt-goals-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  @media (max-width:1200px){.bgt-goals-grid{grid-template-columns:repeat(4,1fr);}}
  @media (max-width:900px){.bgt-goals-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:600px){.bgt-goals-grid{grid-template-columns:repeat(2,1fr);}}
  .bgt-goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;display:flex;flex-direction:column;}
  .bgt-goal-card:hover{box-shadow:var(--shadow);border-color:var(--border-strong);transform:translateY(-2px);}
  .bgt-goal-photo{aspect-ratio:1/1;background-color:var(--surface-2);background-position:center;background-size:cover;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--text-dim);}
  .bgt-goal-body{padding:10px 11px 12px;}
  .bgt-goal-title{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bgt-goal-cost{font-size:12.5px;color:var(--text-dim);margin:2px 0 7px;font-weight:700;}
  .bgt-goal-type-badge{display:inline-block;padding:3px 8px;border-radius:5px;background:var(--accent-light);color:var(--accent-dark);font-size:10px;font-weight:800;}
  .bgt-goal-photo-picker{width:100%;max-width:180px;aspect-ratio:1/1;margin:0 auto 14px;border-radius:10px;background-color:var(--surface-2);background-position:center;background-size:cover;background-repeat:no-repeat;border:1.5px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);font-size:12px;font-weight:700;text-align:center;gap:6px;transition:border-color .15s,color .15s;}
  .bgt-goal-photo-picker:hover{border-color:var(--accent);color:var(--accent);}


  .view{flex:1;overflow-y:auto;padding:22px 26px 60px;}
  .filters-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .chip{
    border-radius:999px;
    padding:7px 14px;border:1px solid var(--border);background:var(--surface-2);
    font-size:12.5px;font-weight:700;color:var(--text-dim);display:inline-flex;align-items:center;gap:6px;transition:.15s;
    cursor:pointer;
  }
  .chip:hover{background:var(--surface-3);}
  .chip.active{background:var(--accent-grad);border-color:transparent;color:#fff;}
  .chip:active{transform:translateY(1px);}

  /* dashboard */
  .quote-hero{
    background:var(--accent-grad);color:#fff;border-radius:var(--radius);
    padding:36px 32px 30px;margin-bottom:18px;text-align:center;box-shadow:var(--shadow);
  }
  .quote-greeting{font-size:12.5px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.06em;}
  .quote-date{font-size:12px;opacity:.7;margin-top:3px;text-transform:capitalize;}
  .quote-mark{font-size:44px;line-height:1;font-weight:800;opacity:.35;margin-top:8px;font-family:Georgia,serif;}
  .quote-text{font-size:21px;font-weight:700;line-height:1.45;max-width:640px;margin:0 auto;}
  .quote-author{margin-top:14px;font-size:12.5px;opacity:.85;font-weight:600;}
  @media (max-width:700px){ .quote-text{font-size:17px;} .quote-hero{padding:26px 18px 22px;} }
  .dash-expense-pill{
    display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:8px 16px;margin-bottom:16px;font-size:13px;color:var(--text-dim);font-weight:600;box-shadow:var(--shadow);
  }
  .dash-expense-pill strong{color:var(--text);font-weight:800;}
  .day-hero{
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border:1px solid var(--border);padding:14px 20px;margin-bottom:18px;box-shadow:var(--shadow);flex-wrap:wrap;gap:10px;
  }
  .day-hero .date{font-size:17px;font-weight:800;text-transform:capitalize;}
  .quick-actions{display:flex;gap:10px;}
  .grid-dash{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  @media (max-width:1100px){.grid-dash{grid-template-columns:1fr 1fr;}}
  @media (max-width:760px){.grid-dash{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);}
  .card h3{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .card h3 .count{margin-left:auto;font-size:11px;background:var(--surface-2);border-radius:var(--radius-sm);padding:2px 8px;color:var(--text-dim);font-weight:700;}
  .empty-hint{color:var(--text-dim);font-size:12.5px;padding:10px 2px;}
  .list-row{display:flex;align-items:center;gap:10px;padding:9px 6px;transition:.12s;cursor:pointer;}
  .list-row:hover{background:var(--surface-2);}
  .list-row .title{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-row .meta{font-size:11.5px;color:var(--text-dim);flex:none;}
  .row-trash-btn{background:none;border:none;color:var(--text-dim);padding:4px;flex:none;opacity:.55;transition:.12s;}
  .row-trash-btn:hover{opacity:1;color:var(--pr-critical);}
  .tx-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 22px;}
  .tx-row{display:flex;align-items:center;gap:8px;padding:9px 6px;border-radius:8px;transition:.12s;cursor:pointer;min-width:0;}
  .tx-row:hover{background:var(--surface-2);}
  .tx-row .title{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-row .date{font-size:11px;color:var(--text-dim);flex:none;white-space:nowrap;}
  .tx-row .amt{font-size:13px;font-weight:800;flex:none;white-space:nowrap;min-width:70px;text-align:right;}
  @media (max-width:520px){.tx-list{grid-template-columns:1fr;}.tx-row .date{display:none;}}
  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;color:#fff;flex:none;border-radius:var(--radius-sm);}
  .quick-capture{display:flex;gap:8px;margin-bottom:18px;}
  .quick-capture input{flex:1;}
  .done-text{text-decoration:line-through;color:var(--text-dim);}

  input,textarea{
    background:var(--surface-2);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);
    padding:9px 12px;font-size:13.5px;color:var(--text);width:100%;font-family:inherit;
  }
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
  input[type=checkbox]{width:auto;flex:none;accent-color:var(--accent);cursor:pointer;}
  input[type=color]{width:36px;height:36px;padding:2px;flex:none;cursor:pointer;}
  label{font-size:12px;font-weight:700;color:var(--text-dim);display:block;margin:12px 0 5px;}
  label:first-child{margin-top:0;}

  /* custom select */
  .custom-select{position:relative;display:block;width:100%;}
  .custom-select-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;background:var(--surface-2);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);
    color:var(--text);font-size:13px;font-weight:600;text-align:left;
  }
  .custom-select-btn:hover{border-color:var(--accent);}
  .cs-label{display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cs-chev{flex:none;opacity:.6;}
  .custom-select-panel{
    display:none;position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--surface);border-radius:var(--radius-sm);overflow:hidden;
    border:1.5px solid var(--border-strong);box-shadow:var(--shadow);z-index:60;max-height:220px;overflow-y:auto;
  }
  .custom-select-panel.open{display:block;}
  .custom-select-opt{padding:9px 12px;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .custom-select-opt:hover{background:var(--surface-2);}
  .custom-select-opt.active{font-weight:700;color:var(--accent-dark);background:var(--accent-light);}

  /* custom date picker */
  .custom-datepicker{position:relative;display:block;width:100%;}
  .cdp-panel{
    display:none;position:absolute;top:calc(100% + 3px);left:0;z-index:60;width:264px;
    background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);
    box-shadow:var(--shadow);padding:10px;
  }
  .cdp-panel.open{display:block;}
  .cdp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cdp-month-label{font-size:13px;font-weight:700;text-transform:capitalize;}
  .cdp-dow-row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:var(--text-dim);font-weight:700;margin-bottom:4px;}
  .cdp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cdp-day{aspect-ratio:1/1;border:none;background:transparent;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cdp-day:hover{background:var(--surface-2);}
  .cdp-day-muted{color:var(--text-dim);opacity:.4;}
  .cdp-day-today{box-shadow:inset 0 0 0 1.5px var(--accent);}
  .cdp-day-selected{background:var(--accent-grad);color:#fff;font-weight:800;}
  .cdp-today-btn{width:100%;margin-top:8px;padding:7px;border:none;background:var(--surface-2);border-radius:var(--radius-sm);font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;}
  .cdp-today-btn:hover{background:var(--surface-3);color:var(--text);}

  /* kanban (tasks by workspace) */
  .kanban{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:12px;}
  .kanban-col{flex:none;width:300px;background:#EEF0F8;border:1px solid var(--border);border-radius:18px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px;}
  html[data-theme="dark"] .kanban-col{background:var(--surface);}
  .kanban-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 0;}
  .kanban-col-title{display:flex;align-items:center;gap:8px;min-width:0;}
  .kanban-col-name{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kanban-col-edit{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;padding:0;flex:none;transition:.12s;}
  .kanban-col-edit:hover{background:var(--surface);color:var(--text);}
  .kanban-col-sub{font-size:12px;color:var(--text-dim);font-weight:500;padding:0 4px 2px;margin-top:-6px;}
  .kcard{background:var(--surface);border-radius:12px;padding:12px 12px 10px;box-shadow:0 1px 2px rgba(16,24,64,.05);border:1px solid transparent;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:9px;}
  .kcard:hover{border-color:var(--border-strong);box-shadow:0 4px 14px rgba(16,24,64,.08);}
  .kcard-done{opacity:.6;}
  .kcard-top{display:flex;align-items:flex-start;gap:9px;}
  .kcard-top input[type=checkbox]{margin-top:2px;}
  .kcard-title{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.35;word-break:break-word;}
  .kcard-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .ktag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .kcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-dim);}
  .kcard-date{font-weight:600;}
  .kcard-date.overdue{color:var(--pr-critical);}
  .kcard-meta{display:flex;align-items:center;gap:6px;font-size:11px;}
  .kcard-meta svg{width:12px;height:12px;display:inline-block;vertical-align:-2px;}
  .kanban-add-card{border:1px dashed var(--border-strong);background:rgba(255,255,255,.55);color:var(--text-dim);border-radius:10px;padding:10px;font-size:13px;font-weight:600;transition:.12s;}
  .kanban-add-card:hover{background:var(--surface);color:var(--accent);border-color:var(--accent);}
  .kanban-add-col{flex:none;width:300px;min-height:84px;border:1.5px dashed var(--border-strong);background:transparent;color:var(--text-dim);border-radius:18px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:.12s;}
  .kanban-add-col:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
  .chip-add{border-style:dashed;background:transparent;}
  .chip-add svg{width:13px;height:13px;}
  @media (max-width:700px){.kanban{flex-direction:column;overflow-x:visible;}.kanban-col,.kanban-add-col{width:100%;}}

  /* direction columns (tasks / projects) */
  .dir-columns{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;align-items:start;max-width:880px;}
  @media (max-width:1100px){.dir-columns{grid-template-columns:1fr;}}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .section-head h3{margin:0;font-size:15px;font-weight:800;}
  .col-task-row{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .col-task-row:last-child{border-bottom:none;}
  .col-task-row:hover{background:var(--surface-2);}
  .col-task-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .col-task-meta{font-size:10.5px;color:var(--text-dim);flex:none;display:flex;align-items:center;gap:4px;}
  .col-proj-row{padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px;}
  .col-proj-row:last-child{border-bottom:none;}
  .col-proj-row:hover{background:var(--surface-2);}
  .col-proj-row .col-proj-main{flex:1;min-width:0;}
  .col-proj-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .proj-card{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:8px;transition:.12s;}
  .proj-card:last-child{margin-bottom:0;}
  .proj-card:hover{border-color:var(--border-strong);}
  .proj-card-main{flex:1;min-width:0;cursor:pointer;}
  .proj-card-top{display:flex;align-items:center;gap:8px;}
  .proj-complete-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-dim);display:flex;align-items:center;justify-content:center;flex:none;transition:.15s;}
  .proj-complete-btn:hover{background:#22c55e;border-color:#16a34a;color:#fff;transform:scale(1.08);}
  .success-burst{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,0);}
  .success-burst-inner{background:var(--surface);border:2px solid #22c55e;border-radius:20px;padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:successPop .45s cubic-bezier(.34,1.56,.64,1);}
  .success-burst-icon{width:60px;height:60px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;animation:successCheck .4s ease .08s both;}
  .success-burst-text{font-weight:800;font-size:14.5px;text-align:center;max-width:280px;}
  .success-burst.fadeout{animation:successFadeOut .35s ease forwards;}
  @keyframes successPop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
  @keyframes successCheck{from{transform:scale(0);}to{transform:scale(1);}}
  @keyframes successFadeOut{to{opacity:0;}}

  /* projects */
  .status-pill{font-size:10.5px;font-weight:700;padding:3px 9px;display:inline-block;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);border-radius:999px;flex:none;}

  /* calendar */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .cal-head .modes{display:flex;gap:0;background:var(--surface-2);border:1.5px solid var(--border-strong);padding:2px;}
  .cal-head .modes button{padding:6px 14px;border:none;background:transparent;font-size:12.5px;font-weight:700;color:var(--text-dim);}
  .cal-head .modes button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .cal-nav{display:flex;gap:6px;}
  .cal-title{font-weight:700;font-size:15px;text-transform:capitalize;}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border-strong);border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;}
  .month-dow{background:var(--surface-2);padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--text-dim);}
  .month-cell{background:var(--surface);min-height:96px;padding:6px;position:relative;cursor:pointer;}
  .month-cell:hover{background:var(--surface-2);}
  .month-cell.other{opacity:.4;}
  .month-cell.today{background:var(--accent-light);}
  html[data-theme="dark"] .month-cell.today{background:#1a2c1f;}
  .month-cell .dnum{font-size:12px;font-weight:700;margin-bottom:4px;}
  .month-evt{font-size:10.5px;padding:2px 5px;color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-radius:3px;}
  .week-grid{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius);overflow:hidden;position:relative;}
  .week-dow-head{padding:8px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text-dim);border-bottom:1px solid var(--border);border-left:1px solid var(--border);background:var(--surface-2);}
  .week-dow-head.today{color:var(--accent-dark);}
  .hour-label{font-size:10px;color:var(--text-dim);padding:4px;text-align:right;border-top:1px solid var(--border);}
  .week-cell{border-top:1px solid var(--border);border-left:1px solid var(--border);min-height:44px;position:relative;padding:1px;cursor:pointer;}
  .week-cell.work-hour{background:rgba(52,168,83,.07);}
  [data-theme="dark"] .week-cell.work-hour{background:rgba(52,168,83,.14);}
  .week-cell:hover{background:var(--surface-2);}
  .week-evt{background:var(--ws-personal);color:#fff;font-size:10.5px;padding:3px 6px;margin-bottom:2px;cursor:grab;overflow:hidden;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .day-list .week-evt{font-size:12px;padding:8px 10px;}
  .now-line{position:absolute;height:2px;background:#ea4335;z-index:6;pointer-events:none;display:none;}
  .now-line .now-dot{position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ea4335;box-shadow:0 0 0 2px var(--surface);}
  .events-layer{position:absolute;top:0;left:0;right:0;bottom:0;z-index:4;pointer-events:none;}
  .events-layer .cal-evt{position:absolute;pointer-events:auto;color:#fff;font-size:10.5px;line-height:1.3;padding:3px 6px;overflow:hidden;border-radius:4px;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.2);white-space:nowrap;text-overflow:ellipsis;}

  /* side panel (Notion-style) modals */
  .panel-overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;justify-content:flex-end;align-items:stretch;}
  .side-panel{
    width:640px;max-width:94vw;height:100%;background:var(--surface);box-shadow:var(--shadow);
    display:flex;flex-direction:column;border-radius:var(--radius) 0 0 var(--radius);overflow:hidden;
    animation:slideInRight .22s ease-out;
  }
  @keyframes slideInRight{from{transform:translateX(100%);}to{transform:translateX(0);}}

  /* small centered confirm dialog */
  .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:5vh 20px;z-index:200;overflow-y:auto;}
  .modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;width:560px;max-width:100%;box-shadow:var(--shadow);}

  .modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);flex:none;}
  .modal-head h3{margin:0;font-size:18px;}
  .modal-body{padding:22px;flex:1;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .priority-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:10.5px;font-weight:800;flex:none;}
  .checklist-item{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:13px;}
  .checklist-item .txt{flex:1;line-height:1.4;word-break:break-word;padding-top:2px;}
  .checklist-item.done .txt{text-decoration:line-through;color:var(--text-dim);}
  .mini-x{background:none;border:none;color:var(--text-dim);padding:2px;flex:none;}
  .mini-x:hover{color:var(--pr-critical);}
  .link-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;font-size:12px;margin:2px 4px 2px 0;}

  .toast-wrap{position:fixed;bottom:24px;left:24px;display:flex;flex-direction:column;gap:8px;z-index:300;}
  .toast{background:var(--text);color:var(--bg);border-radius:var(--radius-sm);padding:11px 18px;font-size:13px;font-weight:700;box-shadow:var(--shadow);animation:toastin .18s ease-out;}
  @keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
  @media (max-width:900px){
    .sidebar{position:fixed;bottom:0;left:0;right:0;width:100%;height:64px;flex-direction:row;padding:8px 10px;z-index:30;border-right:none;border-top:1px solid var(--border);}
    .brand,.ws-legend,.sidebar-foot,.nav-sep{display:none;}
    .nav{flex-direction:row;justify-content:space-around;overflow:visible;}
    .nav-item{flex-direction:column;font-size:10px;gap:3px;padding:6px;}
    .main{height:calc(100vh - 64px);}
    .grid-dash{grid-template-columns:1fr;}
    .side-panel{width:100vw;max-width:100vw;border-radius:0;}
  }

  /* AI chat widget */
  #aiChatWidget{position:fixed;bottom:22px;right:22px;z-index:90;}
  @keyframes aiPulse{0%{box-shadow:0 0 0 0 rgba(47,78,243,.35);}70%{box-shadow:0 0 0 10px rgba(47,78,243,0);}100%{box-shadow:0 0 0 0 rgba(47,78,243,0);}}
  .ai-fab{
    border-radius:50%;
    width:58px;height:58px;background:var(--accent-grad);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);position:relative;
    transition:transform .18s ease;
  }
  .ai-fab:hover{transform:scale(1.07) rotate(-4deg);}
  .ai-fab.pulse{animation:aiPulse 1.8s ease-out infinite;}
  .ai-fab-badge{position:absolute;top:-4px;right:-4px;background:var(--pr-critical);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;padding:0 4px;display:none;align-items:center;justify-content:center;border:2.5px solid var(--bg);border-radius:50%;}
  .ai-chat-panel{
    border-radius:18px;overflow:hidden;
    display:none;position:absolute;bottom:70px;right:0;width:390px;
    background:var(--surface);border:1px solid var(--border-strong);box-shadow:0 20px 50px -12px rgba(0,0,0,.35);
    flex-direction:column;
    animation:aiPanelIn .2s ease;
  }
  @keyframes aiPanelIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .ai-chat-panel.open{display:flex;}
  .ai-chat-head{display:flex;align-items:center;gap:10px;padding:16px 16px;background:linear-gradient(120deg,var(--accent),var(--accent-dark));color:#fff;}
  .ai-chat-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none;}
  .ai-chat-head-title{font-weight:700;font-size:14px;line-height:1.3;}
  .ai-chat-head-sub{font-size:11px;opacity:.85;display:flex;align-items:center;gap:5px;margin-top:1px;}
  .ai-online-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(255,255,255,.25);flex:none;}
  .ai-chat-messages{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;max-height:360px;min-height:220px;background:var(--surface-2);}
  .ai-msg-row{display:flex;gap:8px;align-items:flex-end;animation:aiMsgIn .18s ease;}
  .ai-msg-row.user{flex-direction:row-reverse;}
  @keyframes aiMsgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .ai-msg-avatar{width:22px;height:22px;border-radius:50%;background:var(--accent-grad);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}

  .ai-msg{padding:9px 13px;font-size:12.8px;line-height:1.55;white-space:pre-line;max-width:78%;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .ai-msg.ai{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .ai-msg.user{background:var(--accent-grad);color:#fff;border-bottom-right-radius:4px;}
  .ai-typing{display:flex;gap:4px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px;width:fit-content;}
  .ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-dim);opacity:.5;animation:aiTypingBounce 1.2s infinite ease-in-out;}

  .ai-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes aiTypingBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
  .ai-chat-quick{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;background:var(--surface-2);border-top:1px solid var(--border);}
  .ai-chat-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface);}
  .ai-chat-input-row input{flex:1;border-radius:20px;padding:9px 15px;}
  .ai-chat-input-row .icon-btn{background:var(--accent-grad);color:#fff;border-radius:50%;}
  .ai-chat-input-row .icon-btn:hover{filter:brightness(1.08);}

  /* inbox */
  .inbox-row{display:flex;align-items:flex-start;gap:12px;padding:13px 6px;border-bottom:1px solid var(--border);}

  .inbox-text{flex:1;font-size:13.5px;padding-top:6px;}
  .inbox-time{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .inbox-menu-wrap{position:relative;}
  .inbox-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow);z-index:60;min-width:150px;}

  .inbox-menu button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:none;font-size:12.5px;color:var(--text);}
  .inbox-menu button:hover{background:var(--surface-2);}

  /* notifications */
  .notif-row{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:none;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text);cursor:pointer;}
  .notif-row:last-child{border-bottom:none;}
  .notif-row:hover{background:var(--surface-2);}

  .sl-eyebrow{font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}

  .sl-sprint-num{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;}
  .sl-sprint-num span{font-size:13px;font-weight:600;color:var(--text-dim);}
  .sl-sprint-days{font-size:12px;font-weight:700;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;}
  .sl-bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:12px 0 10px;}
  .sl-bar>div{height:100%;background:var(--accent-grad);border-radius:999px;transition:width .3s;}
  .sl-sprint-hint{font-size:12px;color:var(--text-dim);}
  .sl-funnel-row{display:grid;grid-template-columns:110px 1fr 34px 40px;align-items:center;gap:10px;padding:6px 0;}
  .sl-funnel-lbl{font-size:12.5px;font-weight:700;}
  .sl-funnel-track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
  .sl-funnel-track>div{height:100%;border-radius:999px;}
  .sl-funnel-n{font-size:13px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;}
  .sl-funnel-conv{font-size:11px;color:var(--text-dim);font-weight:700;text-align:right;}
  .sl-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;}
  .sl-overdue{color:var(--pr-critical);font-weight:700;}
  .sl-muted{color:var(--text-dim);}
  .sl-code{font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none;}

  .sl-toolbar>input{flex:1;min-width:220px;}
  .sl-toolbar-sel{width:220px;max-width:100%;}

  .sl-form .row2 > div > label:first-child{margin-top:12px;}

  .sl-table tbody tr:last-child td{border-bottom:none;}

  .sl-col-empty{font-size:11.5px;color:var(--text-dim);text-align:center;padding:14px 0;}
  .sl-kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;cursor:pointer;transition:.12s;}
  .sl-kcard:hover{border-color:var(--border-strong);box-shadow:var(--shadow);}
  .sl-kfoot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;min-height:24px;}
  .sl-next{border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);border-radius:7px;width:26px;height:24px;display:flex;align-items:center;justify-content:center;}
  .sl-next:hover{color:#fff;background:var(--accent-grad);border-color:transparent;}
  .sl-cities-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .sl-wave{font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:4px 2px 8px;}
  .sl-city-st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .sl-city-active{background:var(--accent-light);color:var(--accent-dark);border-color:transparent;}
  .sl-city-done{color:#16a34a;}
  .sl-tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .sl-tpl{display:flex;flex-direction:column;}
  .sl-tpl-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .sl-tpl-ch{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:#dcfce7;color:#15803d;}
  .sl-tpl-text{font-size:13px;line-height:1.55;white-space:pre-line;flex:1;}
  .sl-tpl-foot{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;}
  .sl-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .sl-checks{display:flex;flex-direction:column;gap:4px;margin-top:14px;}
  .sl-check{display:flex !important;align-items:center;gap:8px;margin:0 !important;font-size:12.5px !important;color:var(--text) !important;font-weight:600 !important;cursor:pointer;}
  .sl-log{font-size:12px;line-height:1.7;background:var(--surface-2);border-radius:8px;padding:8px 12px;}
  .sl-wa-opt{border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.12s;}
  .sl-wa-opt:hover{border-color:var(--accent);background:var(--accent-light);}

  .sl-wa-text{font-size:12.5px;color:var(--text-dim);margin-top:4px;line-height:1.5;white-space:pre-line;}
  @media (max-width:700px){ .sl-funnel-row{grid-template-columns:90px 1fr 28px 34px;} .sl-toolbar-sel{width:100%;} }

function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function todayStr(){ return dstr(new Date()); }
function fmtDateHuman(str){
  if(!str) return '—';
  const d = new Date(str+'T00:00:00');
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function fmtFullDate(d){
  return `${DOW_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderFileLink(f){

}
function timeAgo(ts){
  const diff = (Date.now()-ts)/1000;
  if(diff<60) return 'щойно';
  if(diff<3600) return Math.floor(diff/60)+' хв тому';
  if(diff<86400) return Math.floor(diff/3600)+' год тому';
  return Math.floor(diff/86400)+' дн тому';
}
function addHourStr(t){
  let [h,m] = t.split(':').map(Number);
  h = (h+1)%24;
  return pad(h)+':'+pad(m);
}

function subscribeToData(uid){
  if(dataUnsub){ dataUnsub(); dataUnsub = null; }
  dataUnsub = db.collection('crmData').doc(uid).onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data() || {};
      state.data = {
        tasks: Array.isArray(d.tasks)? d.tasks : [],
        budget: normalizeBudgetData(d.budget),
        sales: normalizeSalesData(d.sales) || defaultSalesData(),
        workspaces: (Array.isArray(d.workspaces) && d.workspaces.length)
          ? d.workspaces.map(w=>({id:w.id, name:w.name||'Без назви', color:/^#/.test(w.color||'')? w.color : (w.id==='personal'?'#EAB308':'#2563EB')}))
          : DEFAULT_WORKSPACES.map(w=>({...w})),
      };
      cleanupKykilData();
      maybeFetchExchangeRates();
      if(!d.sales) setTimeout(saveData, 0);
      else if(migrateSalesTemplates()){ setTimeout(saveData, 0); setTimeout(()=>toast('Шаблони US Websites оновлено'), 300); }
    } else {
      state.data = emptyData();
      db.collection('crmData').doc(uid).set(state.data).catch(()=>{});
    }
    render();
  }, ()=>{ toast('Помилка синхронізації даних'); });
}

function triggerAvatarUpload(){

function handleAvatarFile(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Виберіть файл зображення'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 240;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      state.profile.avatar = canvas.toDataURL('image/jpeg', 0.85);
      saveProfile();
      toast('Фото оновлено');
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  ev.target.value = '';
}

const DEFAULT_ACCENT = '#2f4ef3';
const ACCENT_PRESETS = ['#2f4ef3','#0f766e','#1e3a8a','#7c3aed','#0891b2','#a21caf','#be123c','#b91c1c','#c2410c','#334155'];
function loadAccent(){ return localStorage.getItem(LS_ACCENT) || DEFAULT_ACCENT; }
function shadeColor(hex, percent){
  const f = parseInt(hex.slice(1),16);
  const t = percent<0 ? 0 : 255;
  const p = percent<0 ? percent*-1 : percent;
  const R = f>>16, G = f>>8 & 0x00FF, B = f & 0x0000FF;
  return '#'+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
}
function applyAccent(color){
  const dark = shadeColor(color, -0.22);
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-dark', dark);
  document.documentElement.style.setProperty('--accent-light', shadeColor(color, 0.86));
  document.documentElement.style.setProperty('--accent-grad', `linear-gradient(135deg, ${color} 0%, ${dark} 100%)`);
}
function setAccentColor(color){
  localStorage.setItem(LS_ACCENT, color);
  applyAccent(color);
  render();
}
function resetAccent(){
  localStorage.removeItem(LS_ACCENT);
  applyAccent(DEFAULT_ACCENT);
  render();
}

const DROPDOWN_REGISTRY = {};
function renderCustomSelect(id, options, value, onChange){
  DROPDOWN_REGISTRY[id] = {options, value, onChange};
  return buildSelectHtml(id);
}
function buildSelectHtml(id){
  const cfg = DROPDOWN_REGISTRY[id];
  const selected = cfg.options.find(o=>o.value===cfg.value) || cfg.options[0] || {label:'—',value:''};
  return `<div class="custom-select" id="wrap_${id}">
    <input type="hidden" id="${id}" value="${escapeHtml(selected.value)}">
    <button type="button" class="custom-select-btn" onclick="event.stopPropagation();toggleDropdown('${id}')">
      <span class="cs-label">${selected.dot?`<span class="dot" style="background:${selected.dot}"></span>`:''}${escapeHtml(selected.label||'—')}</span>
      <span class="cs-chev">${ICON.chevronDown}</span>
    </button>
    <div class="custom-select-panel" id="panel_${id}">
      ${cfg.options.map(o=>`<div class="custom-select-opt ${o.value===cfg.value?'active':''}" onclick="event.stopPropagation();selectDropdownOption('${id}','${o.value}')">${o.dot?`<span class="dot" style="background:${o.dot}"></span>`:''}${escapeHtml(o.label)}</div>`).join('')}
    </div>
  </div>`;
}
function toggleDropdown(id){
  const panel = document.getElementById('panel_'+id);
  if(!panel) return;
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.custom-select-panel.open').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('.cdp-panel.open').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('.inbox-menu.open').forEach(p=>p.classList.remove('open'));
  if(!isOpen) panel.classList.add('open');
}
function selectDropdownOption(id, value){
  const cfg = DROPDOWN_REGISTRY[id];
  cfg.value = value;
  const wrap = document.getElementById('wrap_'+id);
  if(wrap) wrap.outerHTML = buildSelectHtml(id);
  if(cfg.onChange) cfg.onChange(value);
}

/* ============================= CUSTOM DATE PICKER ============================= */
const DATEPICKER_REGISTRY = {};
function renderCustomDatePicker(id, value, onChange){
  const base = value? new Date(value+'T00:00:00') : new Date();
  DATEPICKER_REGISTRY[id] = {value: value||'', onChange, viewYear: base.getFullYear(), viewMonth: base.getMonth()};
  return buildDatepickerHtml(id);
}
function buildDatepickerHtml(id){
  const cfg = DATEPICKER_REGISTRY[id];
  return `<div class="custom-datepicker" id="wrap_${id}">
    <input type="hidden" id="${id}" value="${escapeHtml(cfg.value)}">
    <button type="button" class="custom-select-btn" onclick="event.stopPropagation();toggleDatepicker('${id}')">
      <span class="cs-label">${cfg.value? fmtDateHuman(cfg.value) : 'Оберіть дату'}</span>
      <span class="cs-chev">${ICON.chevronDown}</span>
    </button>
    <div class="cdp-panel" id="panel_${id}">
      <div id="grid_${id}">${buildDatepickerGridHtml(id)}</div>
    </div>
  </div>`;
}
function buildDatepickerGridHtml(id){
  const cfg = DATEPICKER_REGISTRY[id];
  const y = cfg.viewYear, m = cfg.viewMonth;
  const first = new Date(y,m,1);
  const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrevMonth = new Date(y,m,0).getDate();
  const todayS = todayStr();
  let cells = '';
  for(let i=0;i<startDow;i++){
    const d = daysInPrevMonth - startDow + 1 + i;
    const dm = m===0? 11 : m-1, dy = m===0? y-1 : y;
    const ds = `${dy}-${pad(dm+1)}-${pad(d)}`;
    cells += `<button type="button" class="cdp-day cdp-day-muted" onclick="event.stopPropagation();selectDatepickerDay('${id}','${ds}')">${d}</button>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const isToday = ds===todayS;
    const isSel = ds===cfg.value;
    cells += `<button type="button" class="cdp-day ${isToday?'cdp-day-today':''} ${isSel?'cdp-day-selected':''}" onclick="event.stopPropagation();selectDatepickerDay('${id}','${ds}')">${d}</button>`;
  }
  const totalCells = startDow + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=1;i<=trailing;i++){
    const dm = m===11? 0 : m+1, dy = m===11? y+1 : y;
    const ds = `${dy}-${pad(dm+1)}-${pad(i)}`;
    cells += `<button type="button" class="cdp-day cdp-day-muted" onclick="event.stopPropagation();selectDatepickerDay('${id}','${ds}')">${i}</button>`;
  }
  return `
  <div class="cdp-head">
    <button type="button" class="icon-btn" onclick="event.stopPropagation();datepickerNavMonth('${id}',-1)">${ICON.chevronL}</button>
    <span class="cdp-month-label">${MONTHS_NOM[m]} ${y}</span>
    <button type="button" class="icon-btn" onclick="event.stopPropagation();datepickerNavMonth('${id}',1)">${ICON.chevronR}</button>
  </div>
  <div class="cdp-dow-row">${DOW_MON.map(d=>`<span>${d}</span>`).join('')}</div>
  <div class="cdp-grid">${cells}</div>
  <button type="button" class="cdp-today-btn" onclick="event.stopPropagation();datepickerToday('${id}')">Сьогодні</button>`;
}
function toggleDatepicker(id){
  const panel = document.getElementById('panel_'+id);
  if(!panel) return;
  const isOpen = panel.classList.contains('open');
  document.querySelectorAll('.cdp-panel.open').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('.custom-select-panel.open').forEach(p=>p.classList.remove('open'));
  if(!isOpen) panel.classList.add('open');
}
function datepickerNavMonth(id, dir){
  const cfg = DATEPICKER_REGISTRY[id];
  let m = cfg.viewMonth + dir, y = cfg.viewYear;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  cfg.viewMonth = m; cfg.viewYear = y;
  const grid = document.getElementById('grid_'+id);
  if(grid) grid.innerHTML = buildDatepickerGridHtml(id);
}
function selectDatepickerDay(id, dateStr){
  const cfg = DATEPICKER_REGISTRY[id];
  cfg.value = dateStr;
  const d = new Date(dateStr+'T00:00:00');
  cfg.viewYear = d.getFullYear(); cfg.viewMonth = d.getMonth();
  const wrap = document.getElementById('wrap_'+id);
  if(wrap) wrap.outerHTML = buildDatepickerHtml(id);
  if(cfg.onChange) cfg.onChange(dateStr);
}
function datepickerToday(id){ selectDatepickerDay(id, todayStr()); }

        <span style="flex:1"></span>
        <button class="btn" onclick="closeModal()">Скасувати</button>
        <button class="btn btn-primary" onclick="saveWorkspaceForm(${isNew?'null':`'${ws.id}'`})">Зберегти</button>
      </div>
    </div>

function saveWorkspaceForm(id){
  const name = document.getElementById('f_ws_name').value.trim();
  if(!name){ toast('Вкажіть назву простору'); return; }
  if(wsList().some(w=>w.id!==id && w.name.toLowerCase()===name.toLowerCase())){ toast('Простір з такою назвою вже є'); return; }
  if(!Array.isArray(state.data.workspaces) || !state.data.workspaces.length) state.data.workspaces = DEFAULT_WORKSPACES.map(w=>({...w}));
  if(id){
    const ws = getWorkspace(id);
    ws.name = name; ws.color = wsModalColor;
    toast('Простір збережено');
  } else {
    state.data.workspaces.push({id:'ws_'+uid(), name, color:wsModalColor});
    toast('Простір створено');
  }
  saveData(); closeModal(); render();
}
function deleteWorkspace(id){
  const ws = getWorkspace(id); if(!ws) return;
  if(wsList().length<=1){ toast('Має лишитись хоча б один простір'); return; }
  const n = state.data.tasks.filter(t=>t.workspace===id && !t.deleted).length;
  const msg = n? `Видалити простір «${ws.name}»? ${n} задач(і) буде перенесено в кошик.` : `Видалити простір «${ws.name}»?`;
  confirmAction(msg, ()=>{
    state.data.tasks.forEach(t=>{ if(t.workspace===id) t.deleted = true; });
    state.data.workspaces = state.data.workspaces.filter(w=>w.id!==id);
    if(state.wsFilter===id) state.wsFilter = 'all';
    if(state.activeWs===id){ state.activeWs = null; if(state.view==='workspace') state.view = 'tasks'; }
    saveData(); closeModal(); toast('Простір видалено'); render();
  });
}

function filteredTasks(){ return state.data.tasks.filter(t=>!t.deleted && (state.wsFilter==='all' || t.workspace===state.wsFilter)); }

/* ============================= БЮДЖЕТ: УТИЛІТИ ============================= */
function bgtRate(ccy){ return (state.data.budget.rates && state.data.budget.rates[ccy]) || 1; }
function toBaseCcy(amount, ccy){ return amount * bgtRate(ccy); }
function fromBaseCcy(amountBase, ccy){ const r = bgtRate(ccy) || 1; return amountBase / r; }
function fmtMoney(amount, ccy){
  const n = Math.round((amount||0)*100)/100;
  return `${n.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})} ${ccy||BUDGET_BASE_CCY}`;
}
function fmtMoneyShort(amount, ccy){
  const n = Math.round(amount||0);
  return `${n.toLocaleString('uk-UA',{maximumFractionDigits:0})} ${ccy||BUDGET_BASE_CCY}`;
}
function dispAmt(amountBase){ return fromBaseCcy(amountBase, state.bgtDisplayCcy); }
function addMonths(d,n){ const r=new Date(d); r.setMonth(r.getMonth()+n); return r; }
function advanceDateStr(dateStr, freq){
  const d = new Date(dateStr+'T00:00:00');
  if(freq==='weekly') return dstr(addDays(d,7));
  if(freq==='biweekly') return dstr(addDays(d,14));
  if(freq==='quarterly') return dstr(addMonths(d,3));
  if(freq==='semiannual') return dstr(addMonths(d,6));
  if(freq==='yearly') return dstr(addMonths(d,12));
  return dstr(addMonths(d,1));
}
function monthRange(d){ const y=d.getFullYear(),m=d.getMonth(); return [dstr(new Date(y,m,1)), dstr(new Date(y,m+1,0))]; }
function yearRange(d){ return [`${d.getFullYear()}-01-01`, `${d.getFullYear()}-12-31`]; }
function getAccounts(){ return state.data.budget.accounts.filter(a=>!a.archived); }
function getAccount(id){ return state.data.budget.accounts.find(a=>a.id===id); }
function accountNativeBalance(acc){
  let bal = acc.initialBalance||0;
  state.data.budget.transactions.forEach(t=>{ if(t.accountId===acc.id) bal += (t.accountEffect||0); });
  return bal;
}
function accountBalanceBase(acc){ return toBaseCcy(accountNativeBalance(acc), acc.currency); }
function totalBalanceBase(){ return getAccounts().reduce((s,a)=>s+accountBalanceBase(a),0); }
function catList(kind){ return kind==='income'? state.data.budget.incomeCategories : state.data.budget.expenseCategories; }
function getExpenseCategory(id){ return state.data.budget.expenseCategories.find(c=>c.id===id); }
function getIncomeCategory(id){ return state.data.budget.incomeCategories.find(c=>c.id===id); }
function getCategoryForTx(t){ return t.type==='income'? getIncomeCategory(t.categoryId) : getExpenseCategory(t.categoryId); }
function isRealTx(t){ return !!t && !t.deleted; }
function txInRange(t, fromStr, toStr){ return t.date>=fromStr && t.date<=toStr; }
function sumExpenseBase(fromStr,toStr, filterFn){
  return state.data.budget.transactions.filter(t=>isRealTx(t) && t.type==='expense' && txInRange(t,fromStr,toStr) && (!filterFn||filterFn(t))).reduce((s,t)=>s+t.convertedAmount,0);
}
function sumIncomeBase(fromStr,toStr, filterFn){
  return state.data.budget.transactions.filter(t=>isRealTx(t) && t.type==='income' && txInRange(t,fromStr,toStr) && (!filterFn||filterFn(t))).reduce((s,t)=>s+t.convertedAmount,0);
}
function buildTransactionRecord(form){
  const rate = bgtRate(form.currency);
  const convertedAmount = Math.round(form.amount*rate*100)/100;
  const fromAcc = getAccount(form.accountId);
  let native = form.amount;
  if(fromAcc && form.currency!==fromAcc.currency) native = fromBaseCcy(convertedAmount, fromAcc.currency);
  const rec = {
    type: form.type,
    amount: form.amount,
    currency: form.currency,
    exchangeRate: rate,
    convertedAmount,
    categoryId: form.type==='transfer'? null : (form.categoryId||null),
    accountId: form.accountId,
    destination: form.type==='transfer'? (form.destination||'') : '',
    date: form.date,
    description: form.description||'',
    recurringId: form.recurringId||null,
    accountEffect: form.type==='income'? native : -native,
  };
  return rec;
}

/* ============================= БЮДЖЕТ: КУРСИ ВАЛЮТ (авто) ============================= */
function fetchExchangeRates(){
  if(typeof fetch!=='function') return;
  fetch('https://open.er-api.com/v6/latest/' + BUDGET_BASE_CCY).then(r=>r.json()).then(data=>{
    if(!data || data.result!=='success' || !data.rates) return;
    const newRates = {}; newRates[BUDGET_BASE_CCY] = 1;
    (state.data.budget.currencies||[]).forEach(c=>{
      if(c!==BUDGET_BASE_CCY && data.rates[c]) newRates[c] = 1/data.rates[c];
    });
    state.data.budget.rates = Object.assign({}, state.data.budget.rates, newRates);
    state.data.budget.ratesUpdatedAt = Date.now();
    saveData();
  }).catch(e=>{ console.error('Курси валют: не вдалося оновити, використовую збережені значення', e); });
}
function maybeFetchExchangeRates(){
  if(!state.data || !state.data.budget) return;
  const last = state.data.budget.ratesUpdatedAt || 0;
  if(Date.now() - last > 6*3600000) fetchExchangeRates();
}

/* ============================= БЮДЖЕТ: АГРЕГАТИ ТА ІНСАЙТИ ============================= */
function budgetOverviewStats(){
  const now = new Date();
  const [mFrom,mTo] = monthRange(now);
  const [pmFrom,pmTo] = monthRange(addMonths(now,-1));
  const income = sumIncomeBase(mFrom,mTo);
  const expense = sumExpenseBase(mFrom,mTo);
  const prevIncome = sumIncomeBase(pmFrom,pmTo);
  const prevExpense = sumExpenseBase(pmFrom,pmTo);
  return {
    balance: totalBalanceBase(),
    income, expense, remainder: income-expense,
    incomeChangePct: prevIncome? Math.round(((income-prevIncome)/prevIncome)*100) : null,
    expenseChangePct: prevExpense? Math.round(((expense-prevExpense)/prevExpense)*100) : null,
  };
}
function upcomingRecurring(limit){
  return (state.data.budget.recurring||[]).filter(r=>r.active).slice().sort((a,b)=>a.nextDate.localeCompare(b.nextDate)).slice(0, limit||5);
}

function setBgtFilter(key,val){ state.bgtFilters[key]=val; render(); }
function setBgtFilters(obj){ Object.assign(state.bgtFilters, obj); render(); }
function bgtPeriodRange(period){
  const now = new Date();
  if(period==='today'){ const s=todayStr(); return [s,s]; }
  if(period==='week'){ const dow=(now.getDay()+6)%7; return [dstr(addDays(now,-dow)), dstr(addDays(now,6-dow))]; }
  if(period==='month') return monthRange(now);
  if(period==='lastmonth') return monthRange(addMonths(now,-1));
  if(period==='year') return yearRange(now);
  return null;
}
function filteredBudgetTx(){
  const f = state.bgtFilters;
  const range = bgtPeriodRange(f.period);
  return state.data.budget.transactions.filter(t=>{
    if(t.deleted) return false;
    if(range && !(t.date>=range[0] && t.date<=range[1])) return false;
    if(f.type!=='all' && t.type!==f.type) return false;
    if(f.categoryId!=='all' && t.categoryId!==f.categoryId) return false;
    if(f.accountId!=='all' && t.accountId!==f.accountId) return false;
    if(f.currency!=='all' && t.currency!==f.currency) return false;
    if(f.search && !(t.description||'').toLowerCase().includes(f.search.toLowerCase())) return false;
    return true;
  }).sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')) || (b.createdAt||0)-(a.createdAt||0));
}
function renderBudgetTransactions(){

let pendingGoalPhoto = '';
function openGoalPhotoPicker(){ const inp=document.getElementById('goalPhotoInput'); if(inp) inp.click(); }
function handleGoalPhotoFile(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Виберіть файл зображення'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 320;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      pendingGoalPhoto = canvas.toDataURL('image/jpeg', 0.75);
      const prev = document.getElementById('goalPhotoPreview');
      if(prev){ prev.style.backgroundImage = `url(${pendingGoalPhoto})`; prev.innerHTML=''; }
      toast('Фото додано');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  ev.target.value = '';
}
