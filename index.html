}

/* ============================= БЮДЖЕТ: МОДАЛКА ТРАНЗАКЦІЇ ============================= */
function txModalContentHtml(type, t, seed){
  const src = t || seed || null;
  const isNew = !t;
  const accounts = getAccounts();
  if(!accounts.length){
    return `<div class="modal-head"><h3>Нова транзакція</h3><span style="flex:1"></span><button class="icon-btn" onclick="closeModal()">${ICON.x}</button></div><div class="modal-body" style="padding-top:22px"><div style="font-size:14px;line-height:1.5">Спочатку додай хоча б один рахунок на сторінці «Рахунки».</div></div><div class="modal-foot"><button class="btn btn-primary" onclick="closeModal();switchView('budget');switchBudgetTab('accounts')">До рахунків</button></div>`;
  }
  const lastUsed = state.data.budget.lastUsed||{};
  const defaultAccId = src? src.accountId : (lastUsed.accountId && getAccount(lastUsed.accountId) ? lastUsed.accountId : accounts[0].id);
  const defaultAcc = getAccount(defaultAccId);
  const defaultCcy = src? src.currency : (lastUsed.currency || (defaultAcc? defaultAcc.currency : BUDGET_BASE_CCY));
  const catKind = type==='income' ? 'income' : 'expense';
  const catList_ = catList(catKind);
  const defaultCatId = (type!=='transfer')? (src&&src.categoryId? src.categoryId : (lastUsed[catKind+'CategoryId'] && catList_.find(c=>c.id===lastUsed[catKind+'CategoryId']) ? lastUsed[catKind+'CategoryId'] : (catList_[0]||{}).id)) : null;
  const accOptions = accounts.map(a=>({value:a.id,label:a.name}));
  return `
  <div class="modal-head"><h3>${isNew?'Нова транзакція':'Транзакція'}</h3><span style="flex:1"></span><button class="icon-btn" onclick="closeModal()">${ICON.x}</button></div>
  <div class="modal-body">
    <div class="bgt-type-switch">
      <button type="button" class="bgt-type-btn ${type==='expense'?'active':''}" onclick="switchTxType('expense')">Витрата</button>
      <button type="button" class="bgt-type-btn ${type==='income'?'active':''}" onclick="switchTxType('income')">Дохід</button>
      <button type="button" class="bgt-type-btn ${type==='transfer'?'active':''}" onclick="switchTxType('transfer')">Переказ</button>
    </div>
    <div class="row2">
      <div><label>Сума</label><input id="tx_amount" class="bgt-input-plain" type="number" step="0.01" min="0" value="${src?src.amount:''}"></div>
      <div><label>Валюта</label>${renderCustomSelect('tx_currency', (state.data.budget.currencies||[]).map(c=>({value:c,label:c})), defaultCcy, null)}</div>
    </div>
    ${type!=='transfer'? `
    <label>Категорія</label>${renderCustomSelect('tx_category', catList_.map(c=>({value:c.id,label:c.name,dot:c.color})), defaultCatId, null)}
    <label>Рахунок</label>${renderCustomSelect('tx_account', accOptions, defaultAccId, null)}
    ` : `
    <label>З рахунку</label>${renderCustomSelect('tx_account', accOptions, defaultAccId, null)}
    <label>Кому / призначення</label><input id="tx_destination" type="text" value="${src?escapeHtml(src.destination||''):''}" placeholder="напр. Другу, Орендодавцю, Revolut">
    `}
    <label>Дата</label>${renderCustomDatePicker('tx_date', src?src.date:todayStr(), null)}
    <label>Коментар</label><input id="tx_desc" type="text" value="${src?escapeHtml(src.description||''):''}" placeholder="необов'язково">
  </div>
  <div class="modal-foot">
    ${!isNew? `<button class="btn btn-ghost" onclick="duplicateTx('${t.id}')">${ICON.plus} Дублювати</button><button class="btn btn-ghost btn-danger-text" onclick="deleteTx('${t.id}')">${ICON.trash} Видалити</button>`:''}
    <span style="flex:1"></span>
    <button class="btn" onclick="closeModal()">Скасувати</button>
    <button class="btn btn-primary" onclick="saveTxForm('${type}', ${isNew?'null':`'${t.id}'`})">Зберегти</button>
  </div>`;
}
function openTxModal(type, id, seed){
  const t = id? state.data.budget.transactions.find(x=>x.id===id) : null;
  type = t? t.type : (type||'expense');
  const html = `<div class="panel-overlay" onmousedown="if(event.target===this)closeModal()"><div class="side-panel" id="txSidePanel">${txModalContentHtml(type, t, seed)}</div></div>`;
  openModal(html);
}
function switchTxType(newType){
  const panel = document.getElementById('txSidePanel');
  if(!panel) return;
  const amountEl = document.getElementById('tx_amount');
  const dateEl = document.getElementById('tx_date');
  const descEl = document.getElementById('tx_desc');
  const accEl = document.getElementById('tx_account');
  const ccyEl = document.getElementById('tx_currency');
  const seed = {
    amount: amountEl? amountEl.value : '',
    date: dateEl? dateEl.value : todayStr(),
    description: descEl? descEl.value : '',
    accountId: accEl? accEl.value : null,
    currency: ccyEl? ccyEl.value : null,
  };
  panel.innerHTML = txModalContentHtml(newType, null, seed);
}
function saveTxForm(type, id){
  const amount = parseFloat(document.getElementById('tx_amount').value);
  if(!amount || amount<=0){ toast('Вкажіть суму'); return; }
  const currency = document.getElementById('tx_currency').value;
  const accountId = document.getElementById('tx_account').value;
  if(!accountId){ toast('Оберіть рахунок'); return; }
  const date = document.getElementById('tx_date').value || todayStr();
  const descEl = document.getElementById('tx_desc');
  const form = {
    type, amount, currency, accountId, date,
    description: descEl? descEl.value : '',
  };
  if(type==='transfer'){
    form.destination = document.getElementById('tx_destination').value.trim();
  } else {
    form.categoryId = document.getElementById('tx_category').value;
    if(!form.categoryId){ toast('Оберіть категорію'); return; }
  }
  const rec = buildTransactionRecord(form);
  if(id){
    const existing = state.data.budget.transactions.find(x=>x.id===id);
    Object.assign(existing, rec);
  } else {
    rec.id = uid(); rec.createdAt = Date.now();
    state.data.budget.transactions.unshift(rec);
  }
  state.data.budget.lastUsed = state.data.budget.lastUsed||{};
  state.data.budget.lastUsed.accountId = accountId;
  state.data.budget.lastUsed.currency = currency;
  if(type!=='transfer') state.data.budget.lastUsed[type+'CategoryId'] = form.categoryId;
  saveData(); closeModal(); toast('Збережено'); render();
}
function duplicateTx(id){
  const t = state.data.budget.transactions.find(x=>x.id===id);
  if(!t) return;
  closeModal();
  openTxModal(t.type, null, Object.assign({}, t, {date: todayStr()}));
}
function deleteTx(id){
  confirmAction('Видалити цю транзакцію?', ()=>{
    state.data.budget.transactions = state.data.budget.transactions.filter(t=>t.id!==id);
    saveData(); closeModal(); toast('Транзакцію видалено'); render();
  });
}

/* ============================= БЮДЖЕТ: АНАЛІТИКА ============================= */
function svgDonutChart(segments, size){
  size = size||160;
  const r = size/2 - 14, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let offset = 0;
  const circles = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = frac*circ;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="20" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}<circle cx="${cx}" cy="${cy}" r="${r-13}" fill="var(--surface)"></circle></svg>`;
}
function svgBarChart(buckets, height){
  height = height||160;
  const max = Math.max(1, ...buckets.map(b=>Math.max(b.income,b.expense)));
  const bw = 18, gap = 10, groupW = bw*2+6, pad=30;
  const width = buckets.length*(groupW+gap)+pad;
  const bars = buckets.map((b,i)=>{
    const x = pad + i*(groupW+gap);
    const hInc = Math.round((b.income/max)*(height-30));
    const hExp = Math.round((b.expense/max)*(height-30));
    return `
      <rect x="${x}" y="${height-20-hInc}" width="${bw}" height="${hInc}" rx="3" fill="var(--pr-medium)"></rect>
      <rect x="${x+bw+6}" y="${height-20-hExp}" width="${bw}" height="${hExp}" rx="3" fill="var(--pr-critical)"></rect>
      <text x="${x+groupW/2}" y="${height-4}" font-size="10" fill="var(--text-dim)" text-anchor="middle">${escapeHtml(b.label)}</text>
    `;
  }).join('');
  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMinYMid meet">${bars}</svg>`;
}
function bgtTrendBuckets(period){
  const now = new Date();
  const buckets = [];
  if(period==='week'){
    for(let i=6;i>=0;i--){ const d=addDays(now,-i); const s=dstr(d); buckets.push({label:DOW[d.getDay()], from:s, to:s}); }
  } else {
    for(let i=5;i>=0;i--){ const d=addMonths(now,-i); const [f,tt]=monthRange(d); buckets.push({label:MONTHS[d.getMonth()].slice(0,3), from:f, to:tt}); }
  }
  return buckets.map(b=>({label:b.label, income:dispAmt(sumIncomeBase(b.from,b.to)), expense:dispAmt(sumExpenseBase(b.from,b.to))}));
}
function bgtDailyTrend(){
  const now = new Date();
  const [mFrom] = monthRange(now);
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const days = [];
  for(let d=1; d<=daysInMonth; d++){
    const ds = mFrom.slice(0,8)+pad(d);
    days.push({day:d, total: sumExpenseBase(ds,ds)});
  }
  return days;
}
function svgTrendChart(days, height){
  height = height||120;
  const max = Math.max(1, ...days.map(d=>d.total));
  const bw = 6, gap=2, padX=4;
  const width = days.length*(bw+gap)+padX*2;
  const bars = days.map((d,i)=>{
    const x = padX+i*(bw+gap);
    const h = Math.round((d.total/max)*(height-16));
    return `<rect x="${x}" y="${height-16-h}" width="${bw}" height="${Math.max(1,h)}" rx="1" fill="var(--accent)" opacity="${d.total>0?1:.25}"></rect>`;
  }).join('');
  return `<svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">${bars}</svg>`;
}
function monthComparisonRows(){
  const now = new Date();
  const [cf,ct] = monthRange(now);
  const [pf,pt] = monthRange(addMonths(now,-1));
  const cats = state.data.budget.expenseCategories;
  return cats.map(c=>{
    const cur = sumExpenseBase(cf,ct, t=>t.categoryId===c.id);
    const prev = sumExpenseBase(pf,pt, t=>t.categoryId===c.id);
    return {category:c, cur, prev, delta:cur-prev};
  }).filter(r=>r.cur>0||r.prev>0).sort((a,b)=>b.cur-a.cur);
}
function bgtCategoryTotals(kind, fromStr, toStr){
  const totals = {};
  state.data.budget.transactions.filter(t=>isRealTx(t)&&t.type===kind&&txInRange(t,fromStr,toStr)).forEach(t=>{
    totals[t.categoryId] = (totals[t.categoryId]||0)+t.convertedAmount;
  });
  const getCat = kind==='income'? getIncomeCategory : getExpenseCategory;
  return Object.entries(totals).map(([cid,val])=>{
    const cat = getCat(cid);
    return {label:cat?cat.name:'Інше', value:dispAmt(val), color:cat?cat.color:'#999'};
  }).sort((a,b)=>b.value-a.value);
}
function setBgtAnalyticsPeriod(p){ state.bgtAnalyticsPeriod = p; render(); }
function setBgtAnalyticsCatType(t){ state.bgtAnalyticsCatType = t; render(); }
function toggleBgtComparisonExpanded(){ state.bgtComparisonExpanded = !state.bgtComparisonExpanded; render(); }

      <div style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px">
        <h3 style="margin:0">${catType==='income'?'Доходи':'Витрати'} за категоріями</h3>
        <div class="bgt-filter-row" style="max-width:160px">
          ${[['expense','Витрати'],['income','Доходи']].map(([id,label])=>`<button type="button" class="bgt-period-tab ${catType===id?'active':''}" onclick="setBgtAnalyticsCatType('${id}')">${label}</button>`).join('')}

      </div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">

      <tbody>
        ${comparison.length? comparison.map(r=>`
        <tr>
          <td>${escapeHtml(r.category.name)}</td>
          <td>${fmtMoneyShort(dispAmt(r.prev), dc)}</td>
          <td>${fmtMoneyShort(dispAmt(r.cur), dc)}</td>
          <td style="color:${r.delta>0?'var(--pr-critical)':(r.delta<0?'var(--pr-medium)':'var(--text-dim)')};font-weight:700">${r.delta>=0?'+':''}${fmtMoneyShort(dispAmt(r.delta), dc)}</td>
        </tr>`).join('') : `<tr><td colspan="4" class="empty-hint">Замало даних</td></tr>`}

/* ============================= AI (rule-based, chat-driven) ============================= */
function aiRecommendText(){
  const open = state.data.tasks.filter(t=>!t.done && !t.deleted);
  if(!open.length) return 'Усі задачі виконано — можна додати нові або відпочити.';
  let out = `Рекомендую зайнятися: «${open[0].title}» (${wsName(open[0].workspace)}).`;
  if(open[1]) out += `\nПотім можна перейти до «${open[1].title}».`;
  out += `\n\nУсього відкритих задач: ${open.length}.`;
  return out;
}
function aiOpenTasksText(){
  const open = state.data.tasks.filter(t=>!t.done && !t.deleted);
  if(!open.length) return 'Відкритих задач немає.';
  return 'Активні задачі:\n' + open.map(t=>`• ${t.title} (${wsName(t.workspace)})`).join('\n');
}
function aiSummaryText(){
  const today = new Date().toDateString();
  const doneToday = state.data.tasks.filter(t=>t.done && t.completedAt && new Date(t.completedAt).toDateString()===today);
  return `Виконано сьогодні: ${doneToday.length} задач(і).`;
}
function aiOverdueText(){
  const ds = todayStr();
  const overdue = state.data.tasks.filter(t=>!t.done && !t.deleted && t.dueDate && t.dueDate<ds);
  if(!overdue.length) return 'Протермінованих задач немає — усе під контролем 👍';
  return 'Протерміновані задачі:\n' + overdue.map(t=>`• ${t.title} (дедлайн ${fmtDateHuman(t.dueDate)}, ${wsName(t.workspace)})`).join('\n');
}
function aiStatsText(){
  const tasks = state.data.tasks.filter(t=>!t.deleted);
  const open = tasks.filter(t=>!t.done);
  const done = tasks.filter(t=>t.done);
  const byWs = wsList().map(w=>`${w.name}: ${open.filter(t=>t.workspace===w.id).length}`).join(', ');
  return `Статистика:\nВідкритих задач: ${open.length}\nВиконаних задач: ${done.length}\n\nПо напрямках — ${byWs}`;
}
function detectWorkspace(text){
  const hit = wsList().find(w=>text.includes(w.name.toLowerCase()) || (w.id==='kofax' && /кофакс/.test(text)) || (w.id==='personal' && /особист/.test(text)));
  return hit ? hit.id : null;
}
function aiWorkspaceTasksText(wsId){
  const tasks = state.data.tasks.filter(t=>!t.done && !t.deleted && t.workspace===wsId);
  if(!tasks.length) return `Активних задач у напрямку «${wsName(wsId)}» немає.`;
  return `Задачі («${wsName(wsId)}»):\n` + tasks.map(t=>`• ${t.title}`).join('\n');
}
function aiHelpText(){
  return 'Ось що я вмію:\n• «рекомендація» — з чого почати\n• «активні задачі» — список відкритих\n• «протерміновані» — прострочені дедлайни\n• «статистика» — загальні цифри\n• «задачі kofax / особисте» — фільтр по напрямку\n• «створи задачу: ...» — додам нову задачу\n• «підсумок дня» — що виконано сьогодні';
}
function parseQuickText(text){
  let t = text.trim();
  t = t.replace(/^(створи|додай|постав)\s+задачу:?/i,'').trim();
  return {title: t || text.trim()};
}
function createTaskFromParsed(parsed, workspace){
  const task = {
    id:uid(), title:parsed.title, description:'', workspace:(workspace && getWorkspace(workspace))? workspace : wsList()[0].id, dueDate:'', priority:null,
    checklist:[], attachments:[], done:false, deleted:false, completedAt:null, createdAt:Date.now(),
  };
  state.data.tasks.unshift(task);
  saveData();
  return task;
}
function aiSplitTaskSilent(taskId){
  const t = getTask(taskId); if(!t) return null;
  const subs = ['Дослідити деталі','Скласти план дій','Виконати основну роботу','Перевірити результат'];
  subs.forEach(s=>{ if(!t.checklist.some(c=>c.text===s)) t.checklist.push({text:s, done:false}); });
  saveData();
  return t;
}
function aiSplitTask(taskId){
  aiSplitTaskSilent(taskId);
  toast('AI додав чеклист-підзадачі');
  openTaskModal(taskId);
}
function generateAiReply(raw){
  const text = raw.toLowerCase();
  if(/допомог|що ти вмієш|можливост|команди/.test(text)) return aiHelpText();
  if(/протермін|прострочен|не встиг/.test(text)) return aiOverdueText();
  if(/статистик|скільки задач|цифри/.test(text)) return aiStatsText();
  if(/рекоменд|що (мені )?зробити|з чого почати|найважлив/.test(text)) return aiRecommendText();
  const ws = detectWorkspace(text);
  if(ws && /задач/.test(text)) return aiWorkspaceTasksText(ws);
  if(/активн\w* задач|що (ще )?відкрит|список задач/.test(text)) return aiOpenTasksText();
  if(/підсумок|звіт за день|що (я )?зробив/.test(text)) return aiSummaryText();
  if(/розбий|підзадач/.test(text)){
    const match = state.data.tasks.find(tk=>text.includes(tk.title.toLowerCase().slice(0,8)));
    if(match){ aiSplitTaskSilent(match.id); return `Додав чеклист-підзадачі до «${match.title}»: Дослідити деталі, Скласти план дій, Виконати основну роботу, Перевірити результат.`; }
    return 'Вкажіть, будь ласка, назву задачі, яку потрібно розбити на підзадачі.';
  }
  if(/привіт|добрий день|вітаю/.test(text) && text.length<25) return 'Привіт! Я можу порекомендувати з чого почати, показати активні чи протерміновані задачі, найближчі події, статистику по проєктах — або створити задачу з тексту. Напишіть «допомога», щоб побачити всі команди.';
  if(/створи задачу|додай задачу|постав задачу|нагадай/.test(text)){
    const parsed = parseQuickText(raw);
    const task = createTaskFromParsed(parsed, 'personal');
    return `Створив задачу «${task.title}» в просторі «Особисте». Подивитись можна на сторінці «Задачі».`;
  }

/* ============================= TASKS (three direction columns) ============================= */
function renderTasks(){
  return `
  ${renderWsFilters()}
  <div class="kanban">
    ${wsList().filter(w=> state.wsFilter==='all' || state.wsFilter===w.id).map(w=>renderTaskColumn(w.id)).join('')}
    ${state.wsFilter==='all'? `<button type="button" class="kanban-add-col" onclick="openWorkspaceModal(null)">${ICON.plus} Новий простір</button>`:''}
  </div>`;
}
function taskWord(n){
  const m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return 'задача';
  if(m10>=2 && m10<=4 && (m100<12 || m100>14)) return 'задачі';
  return 'задач';
}
function renderTaskColumn(wsId){
  const ws = getWorkspace(wsId);
  if(!ws) return '';
  const all = state.data.tasks.filter(t=>t.workspace===wsId && !t.deleted).slice().sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    return (b.priority||0)-(a.priority||0);
  });
  return `
  <div class="kanban-col">
    <div class="kanban-col-head">
      <div class="kanban-col-title"><span class="dot" style="background:${ws.color}"></span><span class="kanban-col-name">${escapeHtml(ws.name)}</span></div>
      <button class="kanban-col-edit" title="Редагувати простір" onclick="openWorkspaceModal('${ws.id}')">${ICON.edit}</button>
    </div>
    <div class="kanban-col-sub">${all.length} ${taskWord(all.length)}</div>
    ${all.map(t=>colTaskRow(t)).join('')}
    <button type="button" class="kanban-add-card" onclick="openTaskModal(null,{workspace:'${wsId}'})">+ Додати задачу</button>
  </div>`;
}
function colTaskRow(t){
  const cl = t.checklist.length;
  const clDone = t.checklist.filter(c=>c.done).length;
  const ws = getWorkspace(t.workspace);
  const overdue = !t.done && t.dueDate && t.dueDate < todayStr();
  return `
  <div class="kcard ${t.done?'kcard-done':''}" onclick="openTaskModal('${t.id}')">
    <div class="kcard-top">
      <input type="checkbox" ${t.done?'checked':''} onclick="event.stopPropagation();toggleTaskDone('${t.id}')">
      <span class="kcard-title ${t.done?'done-text':''}">${escapeHtml(t.title)}</span>
      <button class="row-trash-btn" title="У кошик" onclick="event.stopPropagation();trashTask('${t.id}')">${ICON.trash}</button>
    </div>
    <div class="kcard-tags">
      ${ws? `<span class="ktag" style="background:${ws.color}22;color:${ws.color}">${escapeHtml(ws.name)}</span>`:''}
      ${t.priority? `<span class="ktag" style="background:${priorityColor(t.priority)}22;color:${priorityColor(t.priority)}">Пріоритет ${t.priority}</span>`:''}
    </div>
    <div class="kcard-foot">
      <span class="kcard-date ${overdue?'overdue':''}">${t.dueDate? fmtDateHuman(t.dueDate) : 'Без дедлайну'}</span>
      <span class="kcard-meta">${cl? `${ICON.tasks} ${clDone}/${cl}`:''}${t.attachments.length? ` ${ICON.paperclip} ${t.attachments.length}`:''}</span>
    </div>
  </div>`;
}

function saveTaskForm(id){
  const title = document.getElementById('f_title').value.trim();
  if(!title){ toast('Вкажіть назву задачі'); return; }
  const priorityRaw = document.getElementById('f_priority').value;
  const vals = {
    title,
    description: document.getElementById('f_desc').value,
    workspace: document.getElementById('f_ws').value,
    dueDate: document.getElementById('f_duedate').value,
    priority: priorityRaw ? Math.max(1, Math.min(10, parseInt(priorityRaw))) : null,
  };
  if(id){
    const t = getTask(id);
    Object.assign(t, vals);
    toast('Задачу збережено');
  } else {
    state.data.tasks.unshift(Object.assign({
      id:uid(), checklist:[], attachments:[], done:false, deleted:false, completedAt:null, createdAt:Date.now(),
    }, vals));
    toast('Задачу створено');
  }
  saveData(); closeModal(); render();
}
function toggleChecklist(taskId, idx){
  const t = getTask(taskId); t.checklist[idx].done = !t.checklist[idx].done; saveData(); openTaskModal(taskId);
}
function removeChecklist(taskId, idx){
  const t = getTask(taskId); t.checklist.splice(idx,1); saveData(); openTaskModal(taskId);
}
function addChecklist(taskId){
  const inp = document.getElementById('newChecklistItem');
  if(!inp.value.trim()) return;
  getTask(taskId).checklist.push({text:inp.value.trim(), done:false});
  saveData(); openTaskModal(taskId);
}
function addAttachment(taskId){
  const inp = document.getElementById('newAttachment');
  if(!inp.value.trim()) return;
  getTask(taskId).attachments.push(inp.value.trim());
  saveData(); openTaskModal(taskId);
}
function removeAttachment(taskId, idx){ getTask(taskId).attachments.splice(idx,1); saveData(); openTaskModal(taskId); }

/* ============================= MODAL HELPERS ============================= */
function openModal(html){
  const existing = document.getElementById('modalRoot');
  if(existing) existing.remove();
  const wrap = document.createElement('div');
  wrap.id = 'modalRoot';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  document.addEventListener('keydown', escCloseHandler);
}
function confirmAction(message, onConfirm, opts){
  opts = opts || {};
  const label = opts.label || 'Видалити';
  const danger = opts.danger !== false;
  const old = document.getElementById('confirmRoot');
  if(old) old.remove();
  const wrap = document.createElement('div');
  wrap.id = 'confirmRoot';
  wrap.innerHTML = `
  <div class="modal-overlay" onmousedown="if(event.target===this)closeConfirm()">
    <div class="modal" style="width:380px">
      <div class="modal-body" style="padding-top:22px;flex:none">
        <div style="font-size:14px;line-height:1.5">${escapeHtml(message)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeConfirm()">Скасувати</button>
        <span style="flex:1"></span>
        <button class="btn btn-primary" style="${danger?'background:var(--pr-critical);border-color:var(--pr-critical)':''}" id="confirmActionBtn">${escapeHtml(label)}</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById('confirmActionBtn').onclick = () => { closeConfirm(); onConfirm(); };
}
function closeConfirm(){
  const el = document.getElementById('confirmRoot');
  if(el) el.remove();
}
function closeModal(){
  const el = document.getElementById('modalRoot');
  if(el) el.remove();
  document.removeEventListener('keydown', escCloseHandler);
}
function escCloseHandler(ev){ if(ev.key==='Escape') closeModal(); }

function normalizeSalesData(s){
  if(!s || typeof s!=='object') return null;
  return {
    leads: Array.isArray(s.leads)? s.leads : [],

/* ---------- статистика ---------- */
function salesStats(){
  const leads = state.data.sales.leads;
  const reached = id => leads.filter(l=>salesMaxIdx(l) >= salesStageIdx(id)).length;
  const paid = leads.filter(l=>l.stage==='won' || l.stage==='live');
  const revenue = paid.reduce((s,l)=>s+(Number(l.price)||SALES_PLAN_PRICE[l.plan]||0),0);
  const mrr = leads.filter(l=>l.care && l.stage!=='lost').length * SALES_CARE_PRICE;
  const contacted = reached('contacted');
  const replied = reached('replied');
  return {total:leads.length, contacted, replied, paid:paid.length, revenue, mrr,
          replyRate: contacted? Math.round(replied/contacted*100) : null, reached};
}
function salesDueLeads(){
  const today = todayStr();
  return state.data.sales.leads
    .filter(l=>SALES_OPEN_STAGES.includes(l.stage) && l.nextFollowUp && l.nextFollowUp<=today)
    .sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp));
}

function salesMoveNext(id){
  const l = salesLead(id); if(!l) return;
  const order = ['new','qualified','demo','contacted','replied','proposal','won','live'];
  const i = order.indexOf(l.stage);
  if(i<0 || i>=order.length-1) return;
  salesSetStage(l, order[i+1]);
  saveData(); render();
  toast(`${l.name} → ${salesStage(l.stage).label}`);
}

function saveCityForm(id){
  const v = k => (document.getElementById(k)||{}).value || '';

  const dup = state.data.sales.cities.find(x=>x.code===code && x.id!==id);
  if(dup){ toast('Місто з таким кодом уже є'); return; }
  let c = id? state.data.sales.cities.find(x=>x.id===id) : null;
  if(c && c.code!==code){ state.data.sales.leads.forEach(l=>{ if(l.city===c.code) l.city = code; }); }
  if(!c){ c = {id:uid()}; state.data.sales.cities.push(c); }
  Object.assign(c, {code, name, wave:Math.max(1, parseInt(v('c_wave'))||1), tz:v('c_tz'), status:v('c_status'), why:v('c_why').trim(), note:v('c_note').trim()});
  saveData(); closeModal(); render();
}
function deleteCity(id){
  const c = state.data.sales.cities.find(x=>x.id===id); if(!c) return;
  const n = state.data.sales.leads.filter(l=>l.city===c.code).length;
  confirmAction(n? `Видалити ${c.name}? ${n} лідів залишаться з кодом ${c.code}.` : `Видалити ${c.name}?`, ()=>{
    state.data.sales.cities = state.data.sales.cities.filter(x=>x.id!==id);
    saveData(); closeModal(); render();
  });
}

/* ---------- ШАБЛОНИ ---------- */
function renderSalesTemplates(){
  const t = state.data.sales.templates;
  return `
  <div class="sl-cities-head">
    <div class="sl-sub" style="max-width:640px">Змінні: <b>[Name]</b> — імʼя власника, <b>[Business Name]</b>, <b>[City]</b>, <b>[Demo]</b> — посилання на демо, <b>[ReviewLine]</b> — фраза про рейтинг і відгуки з картки ліда. У картці ліда шаблон підставляється автоматично й відкривається в WhatsApp.</div>
    <button class="btn btn-sm" onclick="openTemplateModal(null)">${ICON.plus} Шаблон</button>
  </div>
  <div class="sl-tpl-grid">
    ${t.length? t.map(x=>`
      <div class="card sl-tpl">
        <div class="sl-tpl-head"><span class="sl-tpl-ch">${x.channel==='email'?'Email':'WhatsApp'}</span><span class="sl-name">${escapeHtml(x.name)}</span></div>
        <div class="sl-tpl-text">${escapeHtml(x.text)}</div>
        <div class="sl-tpl-foot">
          <span class="sl-muted">${x.text.length} симв.</span><span style="flex:1"></span>
          <button class="btn btn-sm btn-ghost" onclick="copyTemplate('${x.id}')">Копіювати</button>
          <button class="btn btn-sm" onclick="openTemplateModal('${x.id}')">${ICON.edit} Редагувати</button>
        </div>
      </div>`).join('') : `<div class="empty-hint">Шаблонів ще немає</div>`}
  </div>`;
}
function copyTemplate(id){ const t = state.data.sales.templates.find(x=>x.id===id); if(t) copySalesText(t.text); }
function copySalesText(text){
  try{ navigator.clipboard.writeText(text).then(()=>toast('Скопійовано'), ()=>toast('Не вдалося скопіювати')); }
  catch(e){ toast('Не вдалося скопіювати'); }
}
function openTemplateModal(id){
  const t = id? state.data.sales.templates.find(x=>x.id===id) : null;
  const isNew = !t;
  openModal(`
  <div class="panel-overlay" onmousedown="if(event.target===this)closeModal()">
    <div class="side-panel">
      <div class="modal-head"><h3>${isNew?'Новий шаблон':'Редагувати шаблон'}</h3><span style="flex:1"></span><button class="icon-btn" onclick="closeModal()">${ICON.x}</button></div>
      <div class="modal-body">
        <div class="row2">
          <div><label>Назва</label><input id="t_name" type="text" value="${t?escapeHtml(t.name):''}" placeholder="Перше · …"></div>
          <div><label>Канал</label>${renderCustomSelect('t_channel', [{value:'whatsapp',label:'WhatsApp'},{value:'email',label:'Email'}], t?t.channel:'whatsapp', null)}</div>
        </div>
        <label>Текст</label><textarea id="t_text" rows="9">${t?escapeHtml(t.text):''}</textarea>
      </div>
      <div class="modal-foot">
        ${!isNew?`<button class="btn btn-ghost btn-danger-text" onclick="deleteTemplate('${t.id}')">${ICON.trash} Видалити</button>`:''}
        <span style="flex:1"></span>
        <button class="btn" onclick="closeModal()">Скасувати</button>
        <button class="btn btn-primary" onclick="saveTemplateForm(${isNew?'null':`'${t.id}'`})">Зберегти</button>
      </div>
    </div>
  </div>`);
}
function saveTemplateForm(id){
  const name = document.getElementById('t_name').value.trim();
  const text = document.getElementById('t_text').value.trim();
  if(!name || !text){ toast('Заповни назву і текст'); return; }
  let t = id? state.data.sales.templates.find(x=>x.id===id) : null;
  if(!t){ t = {id:uid()}; state.data.sales.templates.push(t); }
  Object.assign(t, {name, text, channel:document.getElementById('t_channel').value});
  saveData(); closeModal(); render();
}
function deleteTemplate(id){
  confirmAction('Видалити шаблон?', ()=>{
    state.data.sales.templates = state.data.sales.templates.filter(x=>x.id!==id);
    saveData(); closeModal(); render();
  });
}

/* ---------- ЛІД: картка ---------- */
function salesSetStage(l, stage){
  if(l.stage===stage) return;
  const old = l.stage;
  l.stage = stage;
  l.maxStageIdx = Math.max(l.maxStageIdx ?? salesStageIdx(old), stage==='lost'? -1 : salesStageIdx(stage));
  l.log = l.log || [];
  l.log.unshift({ts:Date.now(), text:`Етап: ${salesStage(old).label} → ${salesStage(stage).label}`});
  if(stage!=='lost' && salesStageIdx(stage)>=salesStageIdx('contacted') && !l.firstContact) l.firstContact = todayStr();
  if(stage==='contacted' && !l.nextFollowUp) l.nextFollowUp = dstr(addDays(new Date(), 3));
  if(!SALES_OPEN_STAGES.includes(stage)) l.nextFollowUp = '';
  l.updatedAt = Date.now();
}
function openLeadModal(id){
  const l = id? salesLead(id) : null;
  const isNew = !l;
  const activeCity = (state.data.sales.cities.find(c=>c.status==='active')||state.data.sales.cities[0]||{}).code || '';
  const cityOpts = state.data.sales.cities.map(c=>({value:c.code,label:c.code+' · '+c.name}));
  const val = (k, d='') => l && l[k]!==undefined && l[k]!==null ? escapeHtml(String(l[k])) : d;
  openModal(`
  <div class="panel-overlay" onmousedown="if(event.target===this)closeModal()">
    <div class="side-panel">
      <div class="modal-head"><h3>${isNew?'Новий лід':escapeHtml(l.name)}</h3><span style="flex:1"></span><button class="icon-btn" onclick="closeModal()">${ICON.x}</button></div>
      <div class="modal-body sl-form">
        ${!isNew && l.phone? `<div class="sl-quick">
          <button class="btn btn-primary btn-sm" onclick="openWaPicker('${l.id}')">${ICON.send} Написати в WhatsApp</button>
          ${l.mapsUrl?`<a class="btn btn-sm" href="${escapeHtml(l.mapsUrl)}" target="_blank" rel="noopener noreferrer">${ICON.pin} Google Maps</a>`:''}
          ${l.demoUrl?`<a class="btn btn-sm" href="${escapeHtml(l.demoUrl)}" target="_blank" rel="noopener noreferrer">Демо</a>`:''}
        </div>`:''}
        <label>Назва бізнесу</label><input id="l_name" type="text" value="${val('name')}" placeholder="напр. 210 Pressure Washing">
        <div class="row2">
          <div><label>Імʼя власника</label><input id="l_owner" type="text" value="${val('owner')}" placeholder="Connor"></div>
          <div><label>Ніша</label>${renderCustomSelect('l_niche', SALES_NICHES.map(n=>({value:n.id,label:n.label})), l?l.niche:'pw', null)}</div>
        </div>
        <div class="row2">
          <div><label>Місто</label>${renderCustomSelect('l_city', cityOpts, l?l.city:activeCity, null)}</div>
          <div><label>Етап</label>${renderCustomSelect('l_stage', SALES_STAGES.map(s=>({value:s.id,label:s.label,dot:s.color})), l?l.stage:'new', null)}</div>
        </div>
        <div class="row2">
          <div><label>Телефон / WhatsApp</label><input id="l_phone" type="tel" value="${val('phone')}" placeholder="+1 210 555 0101"></div>
          <div><label>Email</label><input id="l_email" type="email" value="${val('email')}"></div>
        </div>
        <div class="row2">
          <div><label>Рейтинг</label><input id="l_rating" type="number" step="0.1" min="0" max="5" value="${val('rating')}"></div>
          <div><label>Відгуків</label><input id="l_reviews" type="number" min="0" value="${val('reviews')}"></div>
        </div>
        <div class="row2">
          <div><label>Стан сайту</label>${renderCustomSelect('l_site', SALES_SITE.map(s=>({value:s.id,label:s.label})), l?l.site:'none', null)}</div>
          <div><label>Наступний контакт</label><input id="l_follow" type="date" value="${val('nextFollowUp')}"></div>
        </div>
        <label>Посилання на Google Maps</label><input id="l_maps" type="url" value="${val('mapsUrl')}" placeholder="https://maps.google.com/…">
        <label>Поточний сайт</label><input id="l_website" type="url" value="${val('website')}">
        <label>Демо-сайт</label><input id="l_demo" type="url" value="${val('demoUrl')}" placeholder="https://….vercel.app">
        <div class="row2">
          <div><label>Тариф</label>${renderCustomSelect('l_plan', SALES_PLANS.map(p=>({value:p.id,label:p.label})), l?(l.plan||''):'', null)}</div>
          <div><label>Сума угоди, $</label><input id="l_price" type="number" min="0" value="${val('price')}" placeholder="за тарифом"></div>
        </div>
        <div class="sl-checks">
          <label class="sl-check"><input id="l_hot" type="checkbox" ${l&&l.hot?'checked':''}> Гарячий лід (50+ відгуків без сайту)</label>
          <label class="sl-check"><input id="l_care" type="checkbox" ${l&&l.care?'checked':''}> Підписка Care $${SALES_CARE_PRICE}/міс</label>
        </div>
        <label>Нотатки</label><textarea id="l_notes" rows="3" placeholder="Що відповіли, заперечення, деталі">${l?escapeHtml(l.notes||''):''}</textarea>
        ${!isNew && (l.log||[]).length? `<label>Історія</label><div class="sl-log">${l.log.slice(0,12).map(e=>`<div><span class="sl-muted">${new Date(e.ts).toLocaleDateString('uk-UA',{day:'numeric',month:'short'})}</span> ${escapeHtml(e.text)}</div>`).join('')}</div>`:''}
      </div>
      <div class="modal-foot">
        ${!isNew?`<button class="btn btn-ghost btn-danger-text" onclick="deleteLead('${l.id}')">${ICON.trash} Видалити</button>`:''}
        <span style="flex:1"></span>
        <button class="btn" onclick="closeModal()">Скасувати</button>
        <button class="btn btn-primary" onclick="saveLeadForm(${isNew?'null':`'${l.id}'`})">Зберегти</button>
      </div>
    </div>
  </div>`);
}
function saveLeadForm(id){
  const v = k => ((document.getElementById(k)||{}).value || '').trim();
  const name = v('l_name');
  if(!name){ toast('Вкажи назву бізнесу'); return; }
  let l = id? salesLead(id) : null;
  if(!l){
    l = {id:uid(), createdAt:Date.now(), stage:'new', maxStageIdx:0, log:[{ts:Date.now(), text:'Лід додано'}]};
    state.data.sales.leads.push(l);
  }
  Object.assign(l, {
    name, owner:v('l_owner'), niche:v('l_niche'), city:v('l_city'), phone:v('l_phone'), email:v('l_email'),
    rating:v('l_rating'), reviews:v('l_reviews'), site:v('l_site'), mapsUrl:v('l_maps'), website:v('l_website'),
    demoUrl:v('l_demo'), plan:v('l_plan'), price:v('l_price'), nextFollowUp:v('l_follow'), notes:v('l_notes'),
    hot:document.getElementById('l_hot').checked, care:document.getElementById('l_care').checked,
  });
  salesSetStage(l, v('l_stage') || l.stage);
  l.updatedAt = Date.now();
  saveData(); closeModal(); render();
}
function deleteLead(id){
  const l = salesLead(id); if(!l) return;
  confirmAction(`Видалити ${l.name}?`, ()=>{
    state.data.sales.leads = state.data.sales.leads.filter(x=>x.id!==id);
    saveData(); closeModal(); render();
  });
}

/* ---------- WhatsApp ---------- */
function salesFillTemplate(text, l){
  const first = (l.owner||'').trim().split(/\s+/)[0];
  return text
    .replace(/\[Name\]/g, first || 'there')
    .replace(/\[Business Name\]/g, l.name || 'your business')
    .replace(/\[City\]/g, (salesCityName(l.city)||'').split(',')[0])
    .replace(/\[ReviewLine\]/g, (l.rating && l.reviews) ? `${l.rating} stars from ${l.reviews} reviews is impressive` : (l.rating ? `A ${l.rating}-star rating is impressive` : 'Your reviews are impressive'))
    .replace(/\[Rating\]/g, l.rating || '')
    .replace(/\[Reviews\]/g, l.reviews || '')
    .replace(/\[Demo\]/g, l.demoUrl || '[посилання на демо]');
}
function salesWaNumber(phone){
  let d = (phone||'').replace(/\D/g,'');
  if(d.length===10) d = '1'+d;
  return d;
}
function openWaPicker(id){
  const l = salesLead(id); if(!l) return;
  const tpls = state.data.sales.templates.filter(t=>t.channel!=='email');
  const firstTouch = salesStageIdx(l.stage) < salesStageIdx('contacted');
  openModal(`
  <div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
    <div class="modal" style="width:620px">
      <div class="modal-head"><h3>WhatsApp · ${escapeHtml(l.name)}</h3><span style="flex:1"></span><button class="icon-btn" onclick="closeModal()">${ICON.x}</button></div>
      <div class="modal-body">
        <div class="sl-sub" style="margin-bottom:12px">Обери шаблон: текст підставиться, відкриється WhatsApp, а лід позначиться як «Написали» з нагадуванням через 3 дні.</div>
        ${tpls.map(t=>`
          <div class="sl-wa-opt" onclick="salesSendWa('${l.id}','${t.id}')">
            <div class="sl-name">${escapeHtml(t.name)}</div>
            <div class="sl-wa-text">${escapeHtml(salesFillTemplate(t.text, l))}</div>
          </div>`).join('') || '<div class="empty-hint">Немає WhatsApp-шаблонів</div>'}
        ${firstTouch?'':`<div class="sl-sub" style="margin-top:8px">Це повторний контакт: лічильник дотиків збільшиться, нагадування зсунеться на 4 дні.</div>`}
      </div>
    </div>
  </div>`);
}
function salesSendWa(leadId, tplId){
  const l = salesLead(leadId), t = state.data.sales.templates.find(x=>x.id===tplId);
  if(!l || !t) return;
  const num = salesWaNumber(l.phone);
  if(num.length<11){ toast('Перевір номер телефону: потрібен формат +1 XXX XXX XXXX'); return; }
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(salesFillTemplate(t.text, l))}`, '_blank', 'noopener');
  l.touches = (l.touches||0) + 1;
  l.lastContact = todayStr();
  l.log = l.log || [];
  l.log.unshift({ts:Date.now(), text:`WhatsApp: «${t.name}»`});
  if(salesStageIdx(l.stage) < salesStageIdx('contacted')){
    salesSetStage(l, 'contacted');
    l.nextFollowUp = dstr(addDays(new Date(), 3));
  } else if(SALES_OPEN_STAGES.includes(l.stage)){
    l.nextFollowUp = dstr(addDays(new Date(), 4));
  }
  if(!l.firstContact) l.firstContact = todayStr();
  l.updatedAt = Date.now();
  saveData(); closeModal(); render();
}

/* ============================= INIT ============================= */
applyAccent(loadAccent());
render();
if(state.data && state.data.budget) maybeFetchExchangeRates();
setInterval(maybeFetchExchangeRates, 3600000);
initAiChatWidget();
setInterval(snapshotData, 3600000);
</script>
